<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Academic Contact Miner</title>
<style>
:root{
  --bg:#f3f6fb; --card:#ffffff; --ink:#1b2433; --muted:#5d6b80; --line:#dbe3ef;
  --brand:#1f4f8f; --brand2:#2e75b6; --accent:#1c8c6e; --warn:#a15c00; --err:#b3261e;
  --field:#f8fafd; --chip:#eaf1fb; --logbg:#151b26; --logink:#cdd6e4;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f141c; --card:#171e29; --ink:#e4e9f1; --muted:#9aa7ba; --line:#2a3445;
    --brand:#8bb8f0; --brand2:#5d9be0; --accent:#4cc39f; --warn:#e3a54a; --err:#f08a80;
    --field:#121821; --chip:#1f2a3a; --logbg:#0b0f15; --logink:#c4cede;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45}
header{background:linear-gradient(135deg,#17406f,#2e75b6);color:#fff;padding:22px 16px}
header .in{max-width:1040px;margin:0 auto}
header h1{font-size:1.45rem;font-weight:700;letter-spacing:-.01em}
header p{opacity:.85;font-size:.92rem;margin-top:3px}
main{max-width:1040px;margin:22px auto;padding:0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 24px;margin-bottom:18px}
.card h2{font-size:1rem;color:var(--brand);margin-bottom:14px}
label{display:block;font-size:.84rem;font-weight:600;color:var(--muted);margin-bottom:4px}
input[type=text],input[type=number],input[type=email],input[type=search]{width:100%;padding:9px 12px;border:1.5px solid var(--line);
  border-radius:8px;background:var(--field);color:var(--ink);font-size:.95rem;font-family:inherit}
input:focus{outline:none;border-color:var(--brand2)}
input:focus-visible,button:focus-visible{outline:3px solid color-mix(in srgb,var(--brand2) 45%,transparent);outline-offset:1px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.span2{grid-column:span 2}.span4{grid-column:1/-1}
.hint{font-size:.77rem;color:var(--muted);margin-top:4px}
.chk{display:flex;gap:8px;align-items:flex-start;font-weight:500;color:var(--ink);font-size:.9rem;cursor:pointer}
.chk input{margin-top:3px}
details{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}
summary{cursor:pointer;font-size:.88rem;font-weight:600;color:var(--muted)}
details .grid{margin-top:12px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
button{padding:10px 18px;border-radius:9px;border:1.5px solid var(--brand2);background:transparent;color:var(--brand);
  font-weight:600;font-size:.93rem;cursor:pointer;font-family:inherit}
button.primary{background:linear-gradient(135deg,#2e75b6,#1f4f8f);color:#fff;border:none;padding:11px 26px}
button:disabled{opacity:.45;cursor:not-allowed}
.bar{height:8px;background:var(--chip);border-radius:8px;overflow:hidden;margin-top:16px}
.fill{height:100%;width:0;background:linear-gradient(90deg,#2e75b6,#1c8c6e);transition:width .35s}
.status{font-size:.88rem;margin-top:8px;color:var(--muted);min-height:1.3em}
.log{background:var(--logbg);color:var(--logink);border-radius:10px;padding:12px 14px;font:12px/1.5 Menlo,Consolas,monospace;
  height:150px;overflow-y:auto;margin-top:12px;white-space:pre-wrap;display:none}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.stat{background:var(--chip);border-radius:10px;padding:9px 14px;min-width:120px}
.stat b{display:block;font-size:1.25rem;color:var(--brand);font-variant-numeric:tabular-nums}
.stat span{font-size:.75rem;color:var(--muted)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input[type=search]{flex:1;min-width:180px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;max-height:560px;overflow-y:auto}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th{position:sticky;top:0;background:var(--chip);text-align:left;padding:8px 10px;font-weight:600;color:var(--muted);white-space:nowrap}
td{padding:7px 10px;border-top:1px solid var(--line);vertical-align:top}
td.email{white-space:nowrap}
td a{color:var(--brand2);text-decoration:none}
td a:hover{text-decoration:underline}
.tag{font-size:.7rem;background:var(--chip);color:var(--muted);border-radius:5px;padding:1px 6px;margin-left:4px}
.muted{color:var(--muted)}
.empty{padding:26px;text-align:center;color:var(--muted)}
.ok{color:var(--accent)}.err{color:var(--err)}.warn{color:var(--warn)}
#results{display:none}
@media (max-width:760px){.grid{grid-template-columns:1fr 1fr}.span2{grid-column:1/-1}}
@media (max-width:460px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="in">
  <h1>🎓 Academic Contact Miner</h1>
  <p>Author contact search in Europe PMC</p>
</div></header>

<main>
<section class="card" aria-labelledby="h-search">
  <h2 id="h-search">Search</h2>
  <div class="grid">
    <div class="span4">
      <label for="kw">Keywords</label>
      <input id="kw" type="text" placeholder="e.g.  encapsulation, spray drying, polyphenols" autocomplete="off">
      <div class="hint">Separate keywords with commas.</div>
    </div>
    <div><label for="year">From year</label><input id="year" type="number" min="1950" value="2019"></div>
    <div><label for="maxn">Max papers</label><input id="maxn" type="number" min="10" max="5000" value="300"></div>
    <div class="span2" style="display:flex;align-items:center">
      <label class="chk"><input id="ft" type="checkbox" checked>
        <span>Include open-access full texts</span></label>
    </div>
  </div>

  <details>
    <summary>More options</summary>
    <div class="grid">
      <div><label for="ftcap">Max full texts to read</label><input id="ftcap" type="number" min="10" max="2000" value="300"></div>
      <div class="span4"><label for="known">Skip contacts I already have</label>
        <input id="known" type="file" accept=".csv,.txt,.tsv">
        <div class="hint" id="knownMsg">Load a previous CSV to exclude contacts already collected.</div></div>
    </div>
  </details>

  <div class="actions">
    <button class="primary" id="runBtn">Start search</button>
    <button id="stopBtn" disabled>Stop</button>
  </div>
  <div class="bar" aria-hidden="true"><div class="fill" id="fill"></div></div>
  <div class="status" id="status" role="status" aria-live="polite"></div>
  <div class="log" id="log"></div>
</section>

<section class="card" id="results" aria-labelledby="h-res">
  <h2 id="h-res">Results</h2>
  <div class="stats" id="stats"></div>
  <div class="toolbar">
    <input type="search" id="filter" placeholder="Filter by name, institution, title …" aria-label="Filter results">
    <label class="chk" style="margin:0"><input type="checkbox" id="onlyMail" checked> With e-mail only</label>
    <button id="csvBtn">Download CSV</button>
    <button id="copyBtn">Copy e-mails</button>
  </div>
  <div class="tablewrap"><table>
    <thead><tr><th>Name</th><th>E-mail</th><th>Institution</th><th>Paper</th><th>Year</th></tr></thead>
    <tbody id="tbody"></tbody>
  </table></div>
  <div class="status" id="tableMsg"></div>
</section>

</main>

<script>
"use strict";
const EPMC = "https://www.ebi.ac.uk/europepmc/webservices/rest";
const CURRENT_YEAR = new Date().getFullYear();
const $ = id => document.getElementById(id);

/* ---------- state ---------- */
let ctrl = null, rows = [], knownEmails = new Set(), lastKeywords = [];

/* ---------- UI helpers ---------- */
function log(m){ const l=$("log"); l.style.display="block"; l.textContent += (l.textContent?"\n":"") + m; l.scrollTop=l.scrollHeight; }
function status(m, cls){ $("status").className = "status " + (cls||""); $("status").textContent = m; }
function progress(p){ $("fill").style.width = Math.max(0,Math.min(100,p)) + "%"; }
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clean = s => String(s ?? "").replace(/<[^>]+>/g, "").replace(/\s+/g, " ").trim();

/* ---------- e-mail helpers ---------- */
const EMAIL_G = /[A-Za-z0-9._%+\-]+@[A-Za-z0-9\-]+(?:\.[A-Za-z0-9\-]+)*\.[A-Za-z]{2,}/g;
const EMAIL_1 = /^[A-Za-z0-9._%+\-]+@[A-Za-z0-9\-]+(?:\.[A-Za-z0-9\-]+)*\.[A-Za-z]{2,}$/;
const BAD_DOMAINS = ["example.com","example.org","test.com","schema.org","w3.org","purl.org","crossref.org","elsevier.com",
  "springer.com","springernature.com","wiley.com","mdpi.com","tandf.co.uk","frontiersin.org","plos.org","ebi.ac.uk",
  "ncbi.nlm.nih.gov","arxiv.org","biomedcentral.com","nature.com","acs.org","rsc.org"];
const BAD_LOCAL = ["noreply","no-reply","donotreply","do-not-reply","example","test","placeholder","permissions","editor","editorial","info","support","webmaster"];

function validEmail(e){
  e = e.toLowerCase().replace(/^\.+|\.+$/g, "");
  if (!EMAIL_1.test(e)) return false;
  const at = e.lastIndexOf("@"), local = e.slice(0, at), dom = e.slice(at + 1);
  if (BAD_DOMAINS.some(b => dom === b || dom.endsWith("." + b))) return false;
  if (BAD_LOCAL.some(b => local.startsWith(b))) return false;
  if (/\.(png|jpe?g|gif|svg|webp|css|js)$/.test(e)) return false;
  return true;
}
function extractEmails(text){
  const out = [];
  for (const m of String(text || "").matchAll(EMAIL_G)){
    const e = m[0].toLowerCase().replace(/^\.+|\.+$/g, "");
    if (validEmail(e) && !out.includes(e)) out.push(e);
  }
  return out;
}
function cleanAff(a){
  return clean(String(a || "").replace(EMAIL_G, "").replace(/(Electronic address|E-?mail(?: address)?)\s*:?/gi, ""))
    .replace(/^[\s.;,:]+|[\s.;,:]+$/g, "");
}

/* ---------- name matching: attach each e-mail to the right person ---------- */
const ascii = s => String(s || "").normalize("NFKD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
const tokens = n => ascii(n).split(/[^a-z]+/).filter(Boolean);
function nameKeys(n){ const t = tokens(n); return t.length ? [t.join(""), t[t.length-1] + t[0][0]] : []; }
function nameScore(email, name){
  const local = ascii(email.split("@")[0]).replace(/[^a-z]/g, ""), t = tokens(name);
  if (!local || !t.length) return 0;
  let s = 0;
  t.forEach((x, i) => { if (x.length >= 3 && local.includes(x)) s += (i === t.length - 1) ? 3 : 2; });
  if (!s && t.length >= 2 && local === t.map(x => x[0]).join("")) s = 1;
  return s;
}
function bestEmail(name, emails, requireMatch){
  if (!emails.length) return "";
  let best = "", bs = 0;
  for (const e of emails){ const s = nameScore(e, name); if (s > bs){ bs = s; best = e; } }
  if (bs > 0) return best;
  return requireMatch ? "" : emails[0];
}
function emailFromAffs(name, affs){
  const ems = [];
  affs.forEach(a => extractEmails(a).forEach(e => { if (!ems.includes(e)) ems.push(e); }));
  return bestEmail(name, ems, ems.length > 1);
}

/* ---------- network ---------- */
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function fetchRetry(url, kind){
  let wait = 1500;
  for (let attempt = 0; attempt < 4; attempt++){
    if (ctrl.signal.aborted) throw new DOMException("Stopped", "AbortError");
    let r;
    try { r = await fetch(url, {signal: ctrl.signal}); }
    catch (e){ if (e.name === "AbortError") throw e; if (attempt === 3) throw e; await sleep(wait); wait *= 2; continue; }
    if (r.status === 429 || r.status >= 500){ await sleep(wait); wait *= 2; continue; }
    return kind === "json" ? (r.ok ? r.json() : Promise.reject(new Error("HTTP " + r.status)))
                           : (r.ok ? r.text() : null);
  }
  throw new Error("Server busy, please try again later");
}

/* ---------- Europe PMC search ---------- */
function keywordVariants(kws){
  const k = kws.map(x => x.replace(/[^\p{L}\p{N}\s\-]/gu, " ").trim()).filter(Boolean), out = [];
  [k, k.slice(0, 2), k.slice(0, 1)].forEach(v => { if (v.length && !out.some(o => o.join("|") === v.join("|"))) out.push(v); });
  return out;
}
function parseHit(h){
  const authors = (h.authorList && h.authorList.author) || [];
  if (!authors.length) return null;
  const url = h.pmid ? `https://pubmed.ncbi.nlm.nih.gov/${h.pmid}/`
            : h.doi ? `https://doi.org/${h.doi}` : `https://europepmc.org/article/${h.source}/${h.id}`;
  const paper = {title: clean(h.title), year: String(h.pubYear || ""), url,
                 pmcid: (h.pmcid && h.inEPMC === "Y") ? h.pmcid : "", authors: []};
  for (const a of authors){
    const name = clean(a.lastName ? `${a.firstName || ""} ${a.lastName}` : (a.fullName || ""));
    if (name.length < 3) continue;
    const det = (a.authorAffiliationDetailsList && a.authorAffiliationDetailsList.authorAffiliation) || [];
    let affs = det.map(d => d.affiliation).filter(Boolean);
    if (!affs.length && a.affiliation) affs = [a.affiliation];
    const email = emailFromAffs(name, affs);
    paper.authors.push({name, email, institution: affs.length ? cleanAff(affs[0]) : "", via: email ? "affiliation" : ""});
  }
  return paper;
}
async function searchEPMC(kws, year, maxN){
  for (const v of keywordVariants(kws)){
    const query = v.map(k => `(${k})`).join(" AND ") + ` AND PUB_YEAR:[${year} TO ${CURRENT_YEAR}]`;
    let cursor = "*", papers = [], total = 0;
    while (papers.length < maxN){
      const p = new URLSearchParams({query, resultType: "core", format: "json",
                                     pageSize: String(Math.min(1000, maxN - papers.length)), cursorMark: cursor});
      const d = await fetchRetry(`${EPMC}/search?${p}`, "json");
      total = d.hitCount || total;
      const hits = (d.resultList && d.resultList.result) || [];
      if (!hits.length) break;
      hits.forEach(h => { const x = parseHit(h); if (x) papers.push(x); });
      status(`Searching Europe PMC … ${papers.length} of ${Math.min(total, maxN)} papers`);
      progress(5 + 35 * papers.length / Math.max(1, Math.min(total, maxN)));
      if (!d.nextCursorMark || d.nextCursorMark === cursor) break;
      cursor = d.nextCursorMark;
    }
    log(`Search [${v.join(" + ")}]: ${total} matches, ${papers.length} papers loaded`);
    if (papers.length) return papers.slice(0, maxN);
  }
  return [];
}

/* ---------- open-access full text (JATS XML) ---------- */
function jatsAuthorEmails(xml){
  const doc = new DOMParser().parseFromString(xml, "application/xml");
  if (doc.getElementsByTagName("parsererror").length) return [];
  const front = doc.getElementsByTagName("front")[0] || doc.documentElement;
  const tags = name => Array.from(front.getElementsByTagName(name));
  const notes = {}, pool = [];
  const addPool = e => { if (!pool.includes(e)) pool.push(e); };
  for (const t of ["corresp", "fn", "aff", "author-notes"]){
    for (const el of tags(t)){
      const ems = extractEmails(el.textContent);
      if (!ems.length) continue;
      if (el.getAttribute("id") && (t === "corresp" || t === "fn")) notes[el.getAttribute("id")] = ems;
      ems.forEach(addPool);
    }
  }
  const contribs = [];
  for (const c of tags("contrib")){
    const type = c.getAttribute("contrib-type");
    if (type && type !== "author") continue;
    const nm = c.getElementsByTagName("name")[0];
    let name;
    if (nm){
      const g = nm.getElementsByTagName("given-names")[0], s = nm.getElementsByTagName("surname")[0];
      name = clean(`${g ? g.textContent : ""} ${s ? s.textContent : ""}`);
    } else {
      const sn = c.getElementsByTagName("string-name")[0]; name = sn ? clean(sn.textContent) : "";
    }
    if (!name) continue;
    const direct = [], ref = [];
    for (const e of c.getElementsByTagName("email")) extractEmails(e.textContent).forEach(x => { if (!direct.includes(x)) direct.push(x); });
    for (const x of c.getElementsByTagName("xref"))
      (x.getAttribute("rid") || "").split(/\s+/).forEach(r => (notes[r] || []).forEach(e => { if (!ref.includes(e)) ref.push(e); }));
    direct.forEach(addPool);
    contribs.push({name, direct, ref, corresp: c.getAttribute("corresp") === "yes"});
  }
  const out = new Map(), used = new Set();
  for (const c of contribs){                                 // 1) e-mail inside or linked to the author
    const cands = c.direct.length ? c.direct : c.ref;
    const e = bestEmail(c.name, cands, cands.length > 1 && !c.direct.length);
    if (e && !used.has(e)){ out.set(c.name, e); used.add(e); }
  }
  let left = pool.filter(e => !used.has(e));
  for (const c of contribs){                                 // 2) unlinked e-mails, strict name match
    if (out.has(c.name) || !left.length) continue;
    const e = bestEmail(c.name, left, true);
    if (e){ out.set(c.name, e); used.add(e); left = left.filter(x => x !== e); }
  }
  const pending = contribs.filter(c => c.corresp && !out.has(c.name));
  const corrLeft = [...new Set(Object.values(notes).flat().filter(e => !used.has(e)))];
  if (pending.length === 1 && corrLeft.length === 1) out.set(pending[0].name, corrLeft[0]);   // 3) single corresponding author
  return [...out.entries()];
}
function mergePairs(paper, pairs){
  const taken = new Set(paper.authors.filter(a => a.email).map(a => a.email));
  let added = 0;
  for (const [name, email] of pairs){
    if (taken.has(email)) continue;
    const k = nameKeys(name);
    let t = paper.authors.find(a => nameKeys(a.name).some(x => k.includes(x)));
    if (!t){ t = {name, email: "", institution: "", via: ""}; paper.authors.push(t); }
    if (!t.email){ t.email = email; t.via = "full text"; taken.add(email); added++; }
  }
  return added;
}
async function enrichFullText(papers, cap, par){
  const todo = papers.filter(p => p.pmcid && p.authors.some(a => !a.email)).slice(0, cap);
  if (!todo.length){ log("No open-access full texts to read"); return; }
  log(`Reading ${todo.length} open-access full texts …`);
  let done = 0, added = 0, failed = 0, i = 0;
  const worker = async () => {
    while (i < todo.length && !ctrl.signal.aborted){
      const p = todo[i++];
      try {
        const xml = await fetchRetry(`${EPMC}/${p.pmcid}/fullTextXML`, "text");
        if (xml) added += mergePairs(p, jatsAuthorEmails(xml));
      } catch (e){
        if (e.name === "AbortError") return;
        failed++;
        if (failed >= 8 && done < 10) throw new Error("full texts blocked");
      }
      done++;
      progress(40 + 55 * done / todo.length);
      status(`Reading full texts … ${done} / ${todo.length}  (+${added} e-mails)`);
    }
  };
  try { await Promise.all(Array.from({length: par}, worker)); }
  catch (e){ log("Full texts unavailable — continuing with affiliation e-mails."); }
  log(`Full texts: +${added} e-mails`);
}

/* ---------- flatten & deduplicate ---------- */
function flatten(papers){
  const seen = new Map();
  for (const p of papers){
    for (const a of p.authors){
      const key = ascii(a.name).replace(/[^a-z]/g, "");
      if (key.length < 3) continue;
      const row = {name: a.name, email: (a.email || "").toLowerCase(), institution: a.institution || "",
                   paper_title: p.title, year: p.year, source: a.via === "full text" ? "Europe PMC full text" : "Europe PMC",
                   url: p.url};
      const ex = seen.get(key);
      if (!ex) seen.set(key, row);
      else if (!ex.email && row.email){ if (!row.institution) row.institution = ex.institution; seen.set(key, row); }
      else if (!ex.institution && row.institution) ex.institution = row.institution;
    }
  }
  const owner = new Map();                                  // one e-mail = one person
  for (const r of seen.values()){
    if (!r.email) continue;
    const o = owner.get(r.email);
    if (!o) owner.set(r.email, r);
    else if (nameScore(r.email, r.name) > nameScore(o.email, o.name)){ o.email = ""; owner.set(r.email, r); }
    else r.email = "";
  }
  return [...seen.values()].sort((a, b) => (!a.email - !b.email) || a.name.localeCompare(b.name));
}

/* ---------- results ---------- */
function visibleRows(){
  const q = ascii($("filter").value.trim()), only = $("onlyMail").checked;
  return rows.filter(r => (!only || r.email) && (!q ||
    ascii(`${r.name} ${r.email} ${r.institution} ${r.paper_title}`).includes(q)));
}
function renderTable(){
  const v = visibleRows(), max = 1500, body = $("tbody");
  body.innerHTML = v.slice(0, max).map(r => `<tr>
    <td>${esc(r.name)}</td>
    <td class="email">${r.email ? esc(r.email) + (r.source.endsWith("full text") ? '<span class="tag">full text</span>' : "") : '<span class="muted">—</span>'}</td>
    <td>${esc(r.institution)}</td>
    <td><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.paper_title)}</a></td>
    <td>${esc(r.year)}</td></tr>`).join("") || `<tr><td colspan="5" class="empty">No matching authors</td></tr>`;
  $("tableMsg").textContent = v.length > max ? `Showing ${max} of ${v.length} rows (all rows are in the CSV).` : "";
}
function renderStats(nPapers, skipped, secs){
  const withMail = rows.filter(r => r.email).length;
  const ft = rows.filter(r => r.email && r.source.endsWith("full text")).length;
  $("stats").innerHTML = [
    [nPapers, "papers"], [rows.length, "unique authors"],
    [`${withMail} (${rows.length ? Math.round(withMail / rows.length * 100) : 0}%)`, "with e-mail"],
    [ft, "from full texts"], ...(skipped ? [[skipped, "already collected"]] : []),
    [`${secs} s`, "time"]
  ].map(([b, s]) => `<div class="stat"><b>${esc(b)}</b><span>${esc(s)}</span></div>`).join("");
}
function csvCell(v){ v = String(v ?? ""); return /[",\n\r]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v; }
function downloadCSV(){
  const v = visibleRows(), cols = ["name","email","institution","paper_title","year","source","url"];
  const text = "\ufeff" + [cols.join(","), ...v.map(r => cols.map(c => csvCell(r[c])).join(","))].join("\r\n");
  const slug = lastKeywords.join("_").replace(/[^\w]+/g, "_").slice(0, 40) || "search";
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], {type: "text/csv;charset=utf-8"}));
  a.download = `author_contacts_${slug}_${new Date().toISOString().slice(0, 10)}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
async function copyEmails(){
  const list = [...new Set(visibleRows().map(r => r.email).filter(Boolean))].join("\n");
  try { await navigator.clipboard.writeText(list); $("tableMsg").textContent = `${list.split("\n").filter(Boolean).length} e-mails copied.`; }
  catch { $("tableMsg").textContent = "Copy failed — use Download CSV."; }
}

/* ---------- main ---------- */
async function run(){
  const kws = $("kw").value.split(",").map(s => s.trim()).filter(Boolean);
  if (!kws.length){ status("Enter at least one keyword.", "err"); $("kw").focus(); return; }
  const year = parseInt($("year").value) || 2019;
  const maxN = Math.max(10, Math.min(5000, parseInt($("maxn").value) || 300));
  const cap = Math.max(10, Math.min(2000, parseInt($("ftcap").value) || 300));
  const par = 4;
  saveSettings();
  lastKeywords = kws; ctrl = new AbortController();
  $("runBtn").disabled = true; $("stopBtn").disabled = false;
  $("log").textContent = ""; progress(3); status("Searching Europe PMC …");
  const t0 = Date.now();
  try {
    const papers = await searchEPMC(kws, year, maxN);
    if (!papers.length){ status("No papers found. Try broader keywords or an earlier year.", "warn"); progress(0); return; }
    log(`Affiliations: ${papers.reduce((n, p) => n + p.authors.filter(a => a.email).length, 0)} e-mails`);
    if ($("ft").checked) await enrichFullText(papers, cap, par);
    let all = flatten(papers), skipped = 0;
    if (knownEmails.size){
      const before = all.length;
      all = all.filter(r => !r.email || !knownEmails.has(r.email));
      skipped = before - all.length;
    }
    rows = all;
    const secs = Math.round((Date.now() - t0) / 1000);
    renderStats(papers.length, skipped, secs); renderTable();
    $("results").style.display = "block";
    progress(100);
    const stopped = ctrl.signal.aborted ? " (stopped early)" : "";
    status(`Done${stopped} — ${rows.filter(r => r.email).length} e-mails from ${papers.length} papers in ${secs} s.`, "ok");
  } catch (e){
    if (e.name === "AbortError") status("Stopped.", "warn");
    else { status("Error: " + e.message, "err"); log(String(e)); }
  } finally {
    $("runBtn").disabled = false; $("stopBtn").disabled = true;
  }
}

/* ---------- settings memory (this browser only) ---------- */
const SET_KEYS = ["kw","year","maxn","ftcap"];
function saveSettings(){
  try { localStorage.setItem("acm-settings", JSON.stringify(Object.fromEntries(
    [...SET_KEYS.map(k => [k, $(k).value]), ["ft", $("ft").checked]]))); } catch {}
}
function loadSettings(){
  try {
    const s = JSON.parse(localStorage.getItem("acm-settings") || "{}");
    SET_KEYS.forEach(k => { if (s[k] !== undefined) $(k).value = s[k]; });
    if (s.ft !== undefined) $("ft").checked = s.ft;
  } catch {}
}

/* ---------- wiring ---------- */
$("runBtn").addEventListener("click", run);
$("kw").addEventListener("keydown", e => { if (e.key === "Enter" && !$("runBtn").disabled) run(); });
$("stopBtn").addEventListener("click", () => { if (ctrl) ctrl.abort(); });
$("filter").addEventListener("input", renderTable);
$("onlyMail").addEventListener("change", renderTable);
$("csvBtn").addEventListener("click", downloadCSV);
$("copyBtn").addEventListener("click", copyEmails);
$("known").addEventListener("change", async e => {
  const f = e.target.files[0]; if (!f) return;
  knownEmails = new Set(extractEmails(await f.text()));
  $("knownMsg").textContent = `${knownEmails.size} e-mails loaded from ${f.name}.`;
});
$("year").max = CURRENT_YEAR;
loadSettings();
</script>
